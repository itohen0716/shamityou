<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#fffaf0">
  <title>チューナー｜絲庵 ─ Shamisen ─</title>
  <link rel="stylesheet" href="./style.css?v=500">
</head>
<body>
  <main class="tuner-app">
    <header class="page-header">
      <div>
        <p class="brand">絲庵</p>
        <h1>チューナー</h1>
        <p class="subtitle">三味線の音を聴いて合わせます</p>
      </div>
      <button id="helpButton" class="help-button" type="button" aria-label="使い方を表示">？</button>
    </header>

    <section class="mode-section" aria-labelledby="modeTitle">
      <h2 id="modeTitle" class="section-title">合わせ方を選ぶ</h2>

      <button class="mode-card active" type="button" data-mode="sequence" aria-pressed="true">
        <span class="mode-number">①</span>
        <span class="mode-copy">
          <strong>三弦を順番に合わせていく</strong>
          <small>一の糸から三の糸まで自動で進みます</small>
        </span>
        <span class="mode-check" aria-hidden="true">✓</span>
      </button>

      <button class="mode-card" type="button" data-mode="single" aria-pressed="false">
        <span class="mode-number">②</span>
        <span class="mode-copy">
          <strong>一音、一音合わせていく</strong>
          <small>選んだ糸だけを合わせます</small>
        </span>
        <span class="mode-check" aria-hidden="true">✓</span>
      </button>
    </section>

    <section class="settings-card" aria-label="調弦設定">
      <label class="field">
        <span>一の糸</span>
        <select id="baseStringSelect">
          <option value="1">1本</option><option value="2">2本</option>
          <option value="3">3本</option><option value="4">4本</option>
          <option value="5">5本</option><option value="6" selected>6本</option>
          <option value="7">7本</option><option value="8">8本</option>
          <option value="9">9本</option><option value="10">10本</option>
          <option value="11">11本</option><option value="12">12本</option>
        </select>
      </label>

      <label class="field">
        <span>調子</span>
        <select id="tuningSelect">
          <option value="hon">本調子</option>
          <option value="niage" selected>二上り</option>
          <option value="sansage">三下り</option>
        </select>
      </label>

      <label class="field" id="stringField">
        <span>合わせる糸</span>
        <select id="stringSelect">
          <option value="1">一の糸</option>
          <option value="2">二の糸</option>
          <option value="3">三の糸</option>
        </select>
      </label>
    </section>

    <section class="tuner-card" aria-live="polite">
      <div class="current-string">
        <span id="stringBadge">一の糸</span>
        <span id="targetText">目標 D4・293.7 Hz</span>
      </div>

      <div class="character-area">
        <img
          id="shamiImage"
          class="shami-image"
          src="./images/shami-listening.png"
          alt="耳を澄まして音を聴くシャミ"
          width="154"
          height="154"
        >
      </div>

      <div class="note-area">
        <div id="detectedNote" class="note-name">—</div>
        <div class="frequency">
          <span id="frequencyValue">--.-</span>
          <span>Hz</span>
        </div>
      </div>

      <div class="meter" aria-label="音程のずれ">
        <div class="meter-labels" aria-hidden="true">
          <span>低い</span>
          <span>合っている</span>
          <span>高い</span>
        </div>
        <div class="meter-track">
          <div class="meter-center" aria-hidden="true"></div>
          <div id="meterNeedle" class="meter-needle" aria-hidden="true"></div>
        </div>
      </div>

      <p id="guideText" class="guide-text">マイクを開始してください</p>
      <p id="centValue" class="cent-value">-- cent</p>

      <div id="progressPanel" class="progress-panel">
        <span class="progress-step active" data-string="1">一の糸</span>
        <span class="progress-line" aria-hidden="true"></span>
        <span class="progress-step" data-string="2">二の糸</span>
        <span class="progress-line" aria-hidden="true"></span>
        <span class="progress-step" data-string="3">三の糸</span>
      </div>
    </section>

    <section class="controls">
      <button id="startButton" class="start-button" type="button">
        <span aria-hidden="true">●</span>
        マイクを開始
      </button>
      <button id="stopButton" class="stop-button" type="button" disabled>停止</button>
    </section>

    <p id="statusText" class="status-text" role="status"></p>
    <a class="home-link" href="../index.html">ホームへ戻る</a>
  </main>

  <dialog id="helpDialog">
    <div class="dialog-content">
      <h2>チューナーの使い方</h2>
      <ol>
        <li>一の糸の本数と調子を選びます。</li>
        <li>合わせ方を選びます。</li>
        <li>マイクを開始し、表示中の糸を一度ずつ鳴らします。</li>
        <li>青側なら音を上げ、桃色側なら音を下げます。</li>
        <li>中央付近で「ぴったり」と表示されたら完了です。</li>
      </ol>
      <p>基準音は再生しません。三味線から出た音だけを測ります。</p>
      <button id="closeHelpButton" class="dialog-close" type="button">閉じる</button>
    </div>
  </dialog>

  <script src="../tuning-master.js?v=401"></script>
  <script src="./app.js?v=500"></script>
</body>
</html>
